# Builds Home Lab for Windows, Linux and macOS.
# - Every push to main / pull request: build check, binaries kept as workflow artifacts.
# - Pushing a tag like v0.1.0: also publishes a GitHub Release with all downloads.
name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: homelab-windows-x64
          - os: ubuntu-22.04 # older glibc = runs on more distros
            target: x86_64-unknown-linux-gnu
            name: homelab-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: homelab-macos-apple-silicon
          - os: macos-latest
            target: x86_64-apple-darwin
            name: homelab-macos-intel

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libwayland-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/homelab.exe dist/${{ matrix.name }}.exe

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          tar -czf dist/${{ matrix.name }}.tar.gz -C target/${{ matrix.target }}/release homelab

      - name: Package (macOS .app)
        if: runner.os == 'macOS'
        run: |
          APP="Home Lab.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" dist
          cp target/${{ matrix.target }}/release/homelab "$APP/Contents/MacOS/homelab"

          mkdir icon.iconset
          for s in 16 32 128 256; do
            sips -z $s $s assets/icon.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
          done
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/icon.icns"

          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Home Lab</string>
            <key>CFBundleDisplayName</key><string>Home Lab</string>
            <key>CFBundleIdentifier</key><string>io.github.homelab-app</string>
            <key>CFBundleExecutable</key><string>homelab</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
          </dict></plist>
          EOF

          ditto -c -k --keepParent "$APP" dist/${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Downloads
            | Platform | File |
            |---|---|
            | Windows 10/11 | `homelab-windows-x64.exe` |
            | Linux (x64) | `homelab-linux-x64.tar.gz` |
            | macOS, Apple Silicon (M1–M4) | `homelab-macos-apple-silicon.zip` |
            | macOS, Intel | `homelab-macos-intel.zip` |

            **macOS:** the app isn't signed. The first time, right-click → *Open* → *Open*.
            **Linux:** `tar -xzf homelab-linux-x64.tar.gz && ./homelab`
