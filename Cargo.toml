[package]
name = "homelab"
version = "0.1.0"
edition = "2021"

[dependencies]
# persistence: remembers window size and position between runs
eframe = { version = "0.29", features = ["persistence"] }
# ring instead of the default aws-lc-rs: no cmake/nasm needed to build
russh = { version = "0.65.2", default-features = false, features = ["ring", "rsa", "flate2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "io-util"] }

[profile.release]
strip = true
lto = true

[build-dependencies]
embed-resource = "3.0.12"
